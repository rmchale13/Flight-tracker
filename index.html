// Calendar peek button: toggles between the current-flight view and the calendar. First tap
// scrolls down to the calendar and starts a 60-second auto-return timer (in case someone leaves
// it up and walks away). A second tap while the calendar is showing jumps back to the top right
// away instead of waiting out the timer.
let calendarPeekTimer = null;
let showingCalendar = false;
// Refresh button: forces a genuinely fresh reload of the page itself, bypassing any cached
// copy — useful on the kiosk specifically, so a new deployment can be picked up with one tap
// instead of needing to SSH in and reboot the whole device.
document.getElementById('refreshBtn').addEventListener('click', () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const url = window.location.origin + window.location.pathname + '?cb=' + Date.now();
  window.location.href = url;
});

document.getElementById('calendarPeekBtn').addEventListener('click', () => {
  if(calendarPeekTimer){ clearTimeout(calendarPeekTimer); calendarPeekTimer = null; }

  if(showingCalendar){
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showingCalendar = false;
  } else {
    const calSection = document.querySelector('.cal-header');
    if(calSection) calSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    showingCalendar = true;
    calendarPeekTimer = setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showingCalendar = false;
      calendarPeekTimer = null;
    }, 60000);
  }
});

// Manual drag-to-scroll: some budget touchscreens report as a plain pointer/mouse device rather
// than true multi-touch, so the browser's native touch-scroll gesture never fires even though
// basic drag input works fine (which is why Leaflet's map panning — which reads raw pointer
// movement itself — still works). This recreates that same manual approach for the whole page.
(function enableDragScroll(){
  let dragging = false, startY = 0, startScroll = 0;

  function insideMap(target){
    return target.closest && target.closest('#mapContainer, #previewMapContainer');
  }

  document.addEventListener('pointerdown', (e) => {
    if(insideMap(e.target)) return; // let Leaflet handle dragging within the map itself
    dragging = true;
    startY = e.clientY;
    startScroll = window.scrollY;
  });
  document.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const delta = e.clientY - startY;
    window.scrollTo({ top: startScroll - delta });
  });
  document.addEventListener('pointerup', () => { dragging = false; });
  document.addEventListener('pointercancel', () => { dragging = false; });
})();

// Manual flight entry form: posts to the same Apps Script backend everything else syncs from,
// so a flight added on one device (e.g. your phone) shows up on every other device (e.g. the
// kiosk) the next time it syncs — not just the browser it was added from.
const MANUAL_CALLSIGN_PREFIXES = {
  UA: "UAL", AA: "AAL", DL: "DAL", WN: "SWA", B6: "JBU",
  AS: "ASA", F9: "FFT", NK: "NKS", HA: "HAL", G4: "AAY",
};

function renderManualFlightsList(){
  const list = MY_FLIGHTS.filter(f => f.isManual);
  const el = document.getElementById('manFlightsList');
  if(!list.length){
    el.innerHTML = '<div style="color:var(--dim);font-size:12px;">No manually-added flights.</div>';
    return;
  }
  el.innerHTML = list.map(f => `
    <div style="display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border-radius:6px;padding:6px 10px;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;">
      <span>${f.flightNo} ${f.from}→${f.to} · ${new Date(f.date).toLocaleString()}</span>
      <button data-id="${f.id}" class="manRemoveBtn" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;">✕</button>
    </div>`).join('');
  el.querySelectorAll('.manRemoveBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      btn.disabled = true;
      try{
        const url = CALENDAR_FEED_URL + (CALENDAR_FEED_URL.includes('?') ? '&' : '?') + 'removeFlight=' + encodeURIComponent(id) + '&cb=' + Date.now();
        await fetch(url, { cache: 'no-store' });
        await syncScheduleFromCalendar();
        renderManualFlightsList();
      }catch(e){
        alert('Could not remove flight — check your connection and try again.');
        btn.disabled = false;
      }
    });
  });
}

document.getElementById('manAddBtn').addEventListener('click', async () => {
  const flightNo = document.getElementById('manFlightNo').value.trim().toUpperCase();
  const from = document.getElementById('manFrom').value.trim().toUpperCase();
  const to = document.getElementById('manTo').value.trim().toUpperCase();
  const dep = document.getElementById('manDep').value;
  const arr = document.getElementById('manArr').value;
  const aircraft = document.getElementById('manAircraft').value.trim();

  if(!flightNo || !from || !to || !dep || !arr){
    alert('Please fill in flight number, from, to, departure, and arrival.');
    return;
  }

  const carrierMatch = flightNo.match(/^([A-Z]{2})(\d+)$/);
  const callsign = carrierMatch
    ? (MANUAL_CALLSIGN_PREFIXES[carrierMatch[1]] || carrierMatch[1]) + carrierMatch[2]
    : flightNo;

  const addBtn = document.getElementById('manAddBtn');
  addBtn.disabled = true;
  addBtn.textContent = 'Adding…';

  try{
    const params = new URLSearchParams({
      addFlight: '1',
      flightNo, callsign, from, to,
      date: new Date(dep).toISOString(),
      arrival: new Date(arr).toISOString(),
      aircraft: aircraft || '',
      cb: Date.now(),
    });
    const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
    await fetch(CALENDAR_FEED_URL + sep + params.toString(), { cache: 'no-store' });

    document.getElementById('manFlightNo').value = '';
    document.getElementById('manFrom').value = '';
    document.getElementById('manTo').value = '';
    document.getElementById('manDep').value = '';
    document.getElementById('manArr').value = '';
    document.getElementById('manAircraft').value = '';

    await syncScheduleFromCalendar();
    renderManualFlightsList();
  }catch(e){
    alert('Could not add flight — check your connection and try again.');
  }finally{
    addBtn.disabled = false;
    addBtn.textContent = 'Add Flight';
  }
});

renderManualFlightsList();

// Flight replay/preview: tapping a flight's chip in the calendar shows its route and times, plus
// either the actual recorded trail (past flights) or a map + forecasted weather (future flights).
document.getElementById('calendarGrid').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip-clickable');
  if(!chip) return;
  const key = chip.getAttribute('data-flight-key');
  if(!key) return;
  if(chip.getAttribute('data-is-past') === 'true') openFlightReplay(key);
  else openFlightPreview(key);
});

async function openFlightReplay(key){
  const flight = MY_FLIGHTS.find(f => (f.flightNo + '_' + f.date) === key);
  if(!flight) return;

  const from = airportInfo(flight.from), to = airportInfo(flight.to);
  const overlay = document.getElementById('replayOverlay');
  overlay.innerHTML = `
    <div class="replay-overlay" id="replayBackdrop">
      <div class="replay-panel">
        <div class="replay-header">
          <h2>${flight.flightNo} · ${cityLabel(from)} → ${cityLabel(to)}</h2>
          <button class="replay-close" id="replayCloseBtn">Close</button>
        </div>
        <div class="replay-times">
          Takeoff: <b>${new Date(flight.date).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}</b>
          &nbsp;&nbsp;→&nbsp;&nbsp;
          Landing: <b>${new Date(flight.arrival).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}</b>
        </div>
        <div id="replayMapContainer" style="height:320px;border-radius:10px;overflow:hidden;"></div>
        <div id="replayNoTrail" style="display:none;" class="replay-no-trail">No tracking data was recorded for this flight.</div>
      </div>
    </div>`;

  document.getElementById('replayCloseBtn').addEventListener('click', () => { overlay.innerHTML = ''; });
  document.getElementById('replayBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'replayBackdrop') overlay.innerHTML = '';
  });

  if(from.lat == null || to.lat == null) return; // unknown airport — map can't render, times still shown above

  const trail = await fetchServerTrail(key);
  if(trail.length > 1){
    const last = trail[trail.length - 1];
    renderMap('replayMapContainer', from, to, 1, { lat: last.lat, lon: last.lon }, trail, false, true);
  } else {
    document.getElementById('replayMapContainer').style.display = 'none';
    document.getElementById('replayNoTrail').style.display = 'block';
  }
}

async function openFlightPreview(key){
  const flight = MY_FLIGHTS.find(f => (f.flightNo + '_' + f.date) === key);
  if(!flight) return;

  const from = airportInfo(flight.from), to = airportInfo(flight.to);
  const overlay = document.getElementById('replayOverlay');
  overlay.innerHTML = `
    <div class="replay-overlay" id="replayBackdrop">
      <div class="replay-panel">
        <div class="replay-header">
          <h2>${flight.flightNo} · ${cityLabel(from)} → ${cityLabel(to)}</h2>
          <button class="replay-close" id="replayCloseBtn">Close</button>
        </div>
        <div class="replay-times">
          Departs: <b>${new Date(flight.date).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}</b>
          &nbsp;&nbsp;→&nbsp;&nbsp;
          Arrives: <b>${new Date(flight.arrival).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}</b>
        </div>
        <div id="previewMapEl" style="height:320px;border-radius:10px;overflow:hidden;"></div>
        <div class="replay-times" id="previewWeather" style="margin-top:14px;">Loading forecast…</div>
        <div class="replay-times" id="previewDetails" style="margin-top:6px;"></div>
        <button class="replay-close" id="hideFlightBtn" style="margin-top:14px;">Hide this flight (booked but not using it)</button>
      </div>
    </div>`;

  document.getElementById('replayCloseBtn').addEventListener('click', () => { overlay.innerHTML = ''; });
  document.getElementById('replayBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'replayBackdrop') overlay.innerHTML = '';
  });
  document.getElementById('hideFlightBtn').addEventListener('click', async () => {
    const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
    const url = `${CALENDAR_FEED_URL}${sep}hideFlight=${encodeURIComponent(key)}&cb=${Date.now()}`;
    await fetch(url, { cache: 'no-store' });
    overlay.innerHTML = '';
    await syncScheduleFromCalendar();
    renderCalendar(MY_FLIGHTS); // syncScheduleFromCalendar only updates the data — this actually redraws it
  });

  if(from.lat != null && to.lat != null){
    // Full planned route, no live position or trail — the flight hasn't happened yet.
    renderMap('previewMapEl', from, to, null, null, [], false, true);
  } else {
    document.getElementById('previewMapEl').style.display = 'none';
  }

  // Forecasted weather at the actual scheduled departure/arrival times, not just "right now" —
  // only meaningful within Open-Meteo's ~15-day reliable forecast window.
  const [wxFrom, wxTo] = await Promise.all([
    getForecastWeather(from, new Date(flight.date)),
    getForecastWeather(to, new Date(flight.arrival)),
  ]);
  const wxEl = document.getElementById('previewWeather');
  if(wxFrom || wxTo){
    const fromText = wxFrom ? `${flight.from}: ${wxFrom.icon} ${wxFrom.temp}°F ${wxFrom.description}` : `${flight.from}: forecast not available yet`;
    const toText = wxTo ? `${flight.to}: ${wxTo.icon} ${wxTo.temp}°F ${wxTo.description}` : `${flight.to}: forecast not available yet`;
    wxEl.innerHTML = `Forecast — ${fromText} &nbsp;&nbsp;|&nbsp;&nbsp; ${toText}`;
  } else {
    wxEl.textContent = 'Forecast not available yet for this far out.';
  }

  // Extra details from AeroDataBox, when available — terminal/gate are usually only assigned
  // within a day or two of departure, so these will often read "TBD" for flights further out.
  try{
    const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
    const url = `${CALENDAR_FEED_URL}${sep}revisedArrival=1&flightNo=${encodeURIComponent(flight.flightNo)}&date=${encodeURIComponent(flight.date)}&cb=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    const detailsEl = document.getElementById('previewDetails');
    if(data.found){
      const parts = [];
      if(data.depTerminal || data.depGate) parts.push(`${flight.from} Terminal ${data.depTerminal || 'TBD'}, Gate ${data.depGate || 'TBD'}`);
      if(data.arrTerminal || data.arrGate) parts.push(`${flight.to} Terminal ${data.arrTerminal || 'TBD'}, Gate ${data.arrGate || 'TBD'}`);
      if(data.aircraftReg) parts.push(`Aircraft reg. ${data.aircraftReg}`);
      if(data.status) parts.push(`Status: ${data.status}`);
      detailsEl.textContent = parts.length ? parts.join(' · ') : 'Gate and terminal not assigned yet.';
    } else {
      detailsEl.textContent = '';
    }
  }catch(e){
    // Silently leave details blank on failure — the map and times above are the important part.
  }
}
</script>
