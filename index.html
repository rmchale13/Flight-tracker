<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daddy's Flight Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --navy:#0B1E33;
    --panel:#142A42;
    --panel-2:#1C3A57;
    --amber:#F5A623;
    --ivory:#EDEAE0;
    --teal:#3AAFA9;
    --dim:#6E85A0;
    --commuter:#A78BFA;
  }
  *{box-sizing:border-box;}
  html{
    scrollbar-width:none; /* Firefox */
    -ms-overflow-style:none; /* old Edge/IE */
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none; /* also suppress the iOS/Android-style press-and-hold menu */
  }
  html::-webkit-scrollbar{ display:none; }
  body{
    margin:0;
    background:radial-gradient(ellipse at top, #102844 0%, var(--navy) 60%);
    color:var(--ivory);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding:32px 24px 60px;
    scrollbar-width:none; /* Firefox */
    -ms-overflow-style:none; /* old Edge/IE */
  }
  body::-webkit-scrollbar{ display:none; } /* Chromium-based browsers, incl. the kiosk display */
  .wrap{max-width:1000px;margin:0 auto;}
  .calendar-peek-btn{
    position:fixed;top:16px;left:72px;z-index:1000;
    width:48px;height:48px;border-radius:50%;
    background:var(--panel-2);border:1px solid rgba(255,255,255,.15);
    color:var(--amber);font-size:22px;cursor:pointer;
    box-shadow:0 6px 16px -4px rgba(0,0,0,.5);
  }
  .refresh-btn{
    position:fixed;top:16px;left:16px;z-index:1000;
    width:48px;height:48px;border-radius:50%;
    background:var(--panel-2);border:1px solid rgba(255,255,255,.15);
    color:var(--teal);font-size:22px;cursor:pointer;
    box-shadow:0 6px 16px -4px rgba(0,0,0,.5);
  }
  .refresh-btn.spinning{ animation:spin 0.8s linear; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;flex-wrap:wrap;gap:8px;}
  header h1{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0;}
  header .clock{font-family:'IBM Plex Mono',monospace;color:var(--ivory);font-size:15px;}

  /* --- Split flap board --- */
  .board{
    background:var(--panel);
    border-radius:14px;
    padding:28px 28px 24px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
    margin-bottom:28px;
    border:1px solid rgba(255,255,255,.06);
  }
  .board-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .board .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin-bottom:0;
  }
  .board .eyebrow.ground{
    font-size:clamp(20px,5vw,30px);letter-spacing:.08em;font-weight:700;
    flex:1;text-align:center;
  }
  .board .eyebrow.flying{
    font-size:clamp(20px,5vw,30px);letter-spacing:.08em;font-weight:700;
    flex:1;text-align:center;
  }
  .board .eyebrow.commuter{ color:var(--commuter); }
  .flap-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .flap{
    background:#0C1D33;
    border-radius:6px;
    padding:14px 4px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:clamp(22px,5vw,38px);
    width:38px;
    color:var(--ivory);
    border-bottom:2px solid rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
  }
  .flap::after{
    content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);
  }
  .flap.space{background:transparent;}
  .flap.wide{width:auto;padding:14px 12px;}

  .route-line{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:6px 0 16px;}
  .airport{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:700;line-height:1;}
  .airport.end{text-align:right;}
  .airport .city{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.02em;margin-top:5px;}
  .airport .weather{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ivory);margin-top:4px;}
  .airport .tag{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}

  #mapContainer, #previewMapContainer{
    height:320px;width:100%;border-radius:10px;overflow:hidden;margin-bottom:18px;
    border:1px solid rgba(255,255,255,.08);
    background:#0C1D33;
  }
  #previewMapContainer{ height:260px; margin-top:14px; }
  #mapContainer .fallback-route-svg, #previewMapContainer .fallback-route-svg{ display:block; width:100%; height:100%; }
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9);}
  .route-dot-label{ font-family:'IBM Plex Sans',sans-serif; font-size:11px; fill:var(--dim); }
  .plane-icon{font-size:22px;filter:drop-shadow(0 0 3px rgba(0,0,0,.6));}

  .location-line{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--dim);margin:0 0 12px;}
  .time-to-land-banner{
    font-family:'IBM Plex Mono',monospace;font-size:clamp(20px,5vw,28px);font-weight:700;
    color:var(--amber);margin:0 0 14px;
  }
  .time-to-land-banner .l{
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:400;color:var(--dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .time-to-land-inline{
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;
    color:var(--amber);text-align:center;margin-bottom:4px;white-space:nowrap;
  }
  .time-to-land-inline .l{
    font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:400;color:var(--dim);
    text-transform:uppercase;letter-spacing:.06em;display:block;
  }
  .stat-row{display:flex;gap:28px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;}
  .stat{min-width:90px;}
  .stat .v{font-size:20px;color:var(--amber);font-weight:700;}
  .stat .l{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}

  .ground-msg{font-size:16px;color:var(--dim);}
  .landed-banner{
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;
    color:var(--teal);margin:0 0 10px;
  }
  .estimate-warning{
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;
    color:#1C1508;background:var(--amber);border-radius:8px;
    padding:8px 14px;margin:0 0 14px;display:inline-block;
  }
  .progress-track{
    position:relative;height:6px;background:rgba(255,255,255,.1);border-radius:3px;
    margin:14px 0 20px;
  }
  .mid-column{
    flex:1;margin:0 16px;align-self:center;
  }
  .progress-fill{
    position:absolute;top:0;left:0;height:100%;background:var(--teal);border-radius:3px;
  }
  .progress-plane{
    position:absolute;top:50%;font-size:16px;transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 3px rgba(0,0,0,.6));
  }
  .ground-msg b{color:var(--teal);}
  .next-up{font-size:clamp(20px,5vw,28px);color:var(--ivory);font-weight:700;margin-top:6px;line-height:1.25;}
  .next-up b{color:var(--teal);}
  .next-up-date{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--dim);margin-top:4px;}
  .strike{ text-decoration:line-through; color:var(--dim); opacity:.65; }
  .new-time{ color:#E4572E; font-weight:700; }
  .flight-badge{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .flight-badge .text{text-align:right;}
  .flight-badge .logo{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .flight-badge .logo svg{ width:44px;height:44px; }
  .flight-badge .logo-img{ width:100%; height:100%; object-fit:contain; }
  .flight-badge .airline{font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--dim);}
  .flight-badge .num{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;color:var(--ivory);}
  .countdown{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:clamp(18px,4.5vw,26px);
    font-weight:700;color:var(--amber);letter-spacing:.02em;text-align:center;
  }
  .countdown.delayed{ color:#E4572E; }
  .countdown-inline{
    margin-top:0;font-size:16px;white-space:nowrap;
  }

  /* --- Calendar view --- */
  h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:600;}
  .cal-header{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px;}
  .cal-nav-btn{
    background:var(--panel-2);color:var(--amber);border:1px solid rgba(255,255,255,.12);
    border-radius:6px;width:30px;height:30px;font-size:16px;line-height:1;cursor:pointer;
  }
  .calendar-grid{
    display:grid;grid-template-columns:repeat(7, 1fr);gap:6px;
  }
  .cal-weekday{
    text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px;
  }
  .cal-day{
    background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:8px;
    min-height:90px;padding:6px;display:flex;flex-direction:column;gap:4px;
  }
  .cal-day.other-month{ opacity:.3; }
  .cal-day.today{ border-color:var(--amber); border-width:2px; }
  .cal-day .daynum{ font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim); }
  .cal-day.today .daynum{ color:var(--amber);font-weight:700; }
  .cal-flight-chip{
    background:var(--panel-2);border-radius:5px;padding:4px 6px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ivory);
    line-height:1.4;
  }
  .cal-flight-chip .chip-time{ display:block;color:var(--amber);font-weight:700; }
  .cal-flight-chip .chip-route{ display:block; }
  .cal-flight-chip.commuter{ border-left:3px solid var(--commuter); }
  .cal-flight-chip.commuter .chip-time{ color:var(--commuter); }
  .cal-flight-chip.chip-clickable{ cursor:pointer; }
  .cal-flight-chip.chip-clickable:active{ background:var(--panel); }

  .replay-overlay{
    position:fixed; inset:0; background:rgba(6,14,26,.85); z-index:2000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .replay-panel{
    background:var(--panel); border-radius:14px; padding:24px; max-width:900px; width:100%;
    max-height:90vh; overflow-y:auto; border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7);
  }
  .replay-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .replay-header h2{ margin:0; font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--ivory); }
  .replay-close{
    background:var(--panel-2); color:var(--dim); border:1px solid rgba(255,255,255,.15);
    border-radius:8px; padding:6px 14px; font-family:'IBM Plex Mono',monospace; font-size:14px; cursor:pointer;
  }
  .replay-times{ font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--dim); margin-bottom:14px; }
  .replay-times b{ color:var(--ivory); }
  .replay-no-trail{ color:var(--dim); font-size:14px; padding:20px 0; text-align:center; }
  .cal-layover{
    font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);
    font-style:italic;padding:0 2px;line-height:1.2;
  }

  .setup{
    margin-top:36px;font-size:13px;color:var(--dim);line-height:1.6;
    border-top:1px dashed rgba(255,255,255,.12);padding-top:16px;
  }
  .setup code{background:var(--panel);padding:1px 6px;border-radius:4px;color:var(--ivory);}
  /* --- Small-screen tuning (e.g. the 1024x600 kiosk display) — bigger text, tighter
     spacing, so the main dashboard reads clearly and fits without needing to scroll.
     The calendar below is reached by scrolling/the peek button, same as before. --- */
  @media (max-width: 1100px){
    body{ padding:16px 14px 40px; }
    .board{ padding:18px 18px 14px; }
    .board-header{ margin-bottom:10px; }
    .board .eyebrow.ground, .board .eyebrow.flying{ font-size:clamp(22px,6vw,34px); }
    .next-up{ font-size:clamp(22px,6vw,32px); }
    .next-up-date{ font-size:17px; }
    .airport .city{ font-size:14px; }
    .airport .weather{ font-size:14px; }
    .airport .tag{ font-size:11px; }
    .flight-badge .airline{ font-size:14px; }
    .flight-badge .num{ font-size:19px; }
    .flight-badge .logo{ width:52px;height:52px; }
    .countdown{ font-size:clamp(20px,5.5vw,30px); margin-top:10px; }
    .location-line{ font-size:14px; margin:0 0 8px; }
    .time-to-land-banner{ font-size:clamp(22px,6vw,30px); margin:0 0 10px; }
    .stat-row{ gap:18px; }
    .stat .v{ font-size:22px; }
    .stat .l{ font-size:12px; }
    #mapContainer{ height:300px; margin-bottom:12px; }
    #previewMapContainer{ height:230px; margin-top:10px; }

    /* Calendar: bigger, more legible text; trimmed padding/gaps so a full month still
       fits on screen in one view without needing to scroll through the grid itself. */
    .cal-header{ margin-bottom:8px; }
    .calendar-grid{ gap:4px; }
    .cal-day{ min-height:84px; padding:5px; gap:3px; }
    .cal-flight-chip{ font-size:12px; padding:3px 6px; line-height:1.3; }
    .cal-layover{ font-size:10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <button id="calendarPeekBtn" class="calendar-peek-btn">📅</button>
  <button id="refreshBtn" class="refresh-btn" title="Reload latest version">⟳</button>

  <div class="board" id="board">
    <div class="board-header">
      <div class="eyebrow" id="boardEyebrow">Checking status…</div>
      <div id="boardBadge"></div>
    </div>
    <div id="boardBody"><!-- filled by JS --></div>
  </div>

  <div class="cal-header">
    <button id="calPrev" class="cal-nav-btn">‹</button>
    <h2 id="calMonthLabel">Coming Up</h2>
    <button id="calNext" class="cal-nav-btn">›</button>
  </div>
  <div id="calendarGrid" class="calendar-grid"></div>
  <div id="replayOverlay"></div>

  <div class="setup" style="opacity:.5;">Build marker: ZOOM-FIX-v1</div>
  <div class="setup" id="syncStatus">
    Checking calendar sync status…
  </div>
  <button id="syncNowBtn" style="margin-top:10px;background:var(--panel-2);color:var(--amber);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;">Sync Now</button>

  <div class="setup" style="margin-top:24px;">
    <div style="margin-bottom:8px;">Manually add a flight the calendar can't auto-resolve (syncs to all devices):</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <input id="manFlightNo" type="text" placeholder="UA1846" style="background:var(--panel-2);color:var(--ivory);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:90px;">
      <input id="manFrom" type="text" placeholder="From" style="background:var(--panel-2);color:var(--ivory);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:70px;">
      <input id="manTo" type="text" placeholder="To" style="background:var(--panel-2);color:var(--ivory);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:70px;">
      <input id="manDep" type="datetime-local" style="background:var(--panel-2);color:var(--ivory);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
      <input id="manArr" type="datetime-local" style="background:var(--panel-2);color:var(--ivory);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
      <input id="manAircraft" type="text" placeholder="Aircraft (optional)" style="background:var(--panel-2);color:var(--ivory);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:150px;">
      <button id="manAddBtn" style="background:var(--panel-2);color:var(--amber);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;">Add Flight</button>
    </div>
    <div id="manFlightsList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

// ---- LIVE SCHEDULE FEED ----
// Paste the Web App URL from calendar-sync.gs here once you've deployed it.
const CALENDAR_FEED_URL = "https://script.google.com/macros/s/AKfycbz4Rsz8jYyI8nsmWCN1nG7oxI_ys2DQsDzD7AgH2gFRTLKlCAw5Ov1js3xhNtEPHjDHhA/exec";

// Empty starting state — the real schedule loads within a few seconds via the live calendar
// sync below. Deliberately left empty rather than a hardcoded snapshot: a stale fallback here
// would briefly show genuinely wrong flights on every fresh page load, which is worse than a
// brief, honest "loading" state.
let MY_FLIGHTS = [];

// Remembers the FIRST scheduled departure time seen for each flight this session, keyed by
// flight number + route (stable even if the time itself shifts due to a delay). This lets us
// show "was 3:40 PM, now 4:15 PM" and run the delay timer off the original time rather than
// resetting every time the airline updates its estimate.
let originalDepartures = {};
function trackOriginalDepartures(flights){
  flights.forEach(f=>{
    const key = f.flightNo + '_' + f.from + '_' + f.to;
    if(!(key in originalDepartures)){
      originalDepartures[key] = f.date;
    }
    f.originalDate = originalDepartures[key];
  });
}
trackOriginalDepartures(MY_FLIGHTS);

async function syncScheduleFromCalendar(){
  const statusEl = document.getElementById('syncStatus');
  if(!CALENDAR_FEED_URL || CALENDAR_FEED_URL.startsWith("PASTE_")){
    if(statusEl) statusEl.textContent = "Sync not configured (CALENDAR_FEED_URL not set).";
    return;
  }
  try{
    const url = CALENDAR_FEED_URL + (CALENDAR_FEED_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok){
      if(statusEl) statusEl.textContent = `Sync failed: server responded with status ${res.status}. URL: ${url}`;
      return;
    }
    const rawText = await res.text();
    let data;
    try{ data = JSON.parse(rawText); }
    catch(parseErr){
      if(statusEl) statusEl.textContent = `Sync parse error: ${parseErr.message}. Raw length: ${rawText.length}. First 200 chars: ${rawText.slice(0,200)}`;
      return;
    }
    if(Array.isArray(data.flights) && data.flights.length){
      trackOriginalDepartures(data.flights);
      MY_FLIGHTS = data.flights;
      const withAircraft = data.flights.filter(f => f.aircraft).length;
      const commuterCount = data.flights.filter(f => f.isCommuter).length;
      if(statusEl) statusEl.textContent = `Synced OK at ${new Date().toLocaleTimeString()} — ${data.flights.length} flights (${commuterCount} commuter), ${withAircraft} with aircraft type. [raw len: ${rawText.length}]`;
    } else {
      if(statusEl) statusEl.textContent = `Synced, but the feed returned zero flights. Raw length: ${rawText.length}. First 300 chars: ${rawText.slice(0,300)}`;
    }
  }catch(e){
    if(statusEl) statusEl.textContent = `Sync error: ${e.message}`;
  }
}

// Compact time for tight spaces, e.g. "3:40p" or "12:05a" instead of "3:40 PM"
function fmtCompactTime(iso){
  const d = new Date(iso);
  let h = d.getHours();
  const m = d.getMinutes();
  const suffix = h >= 12 ? 'p' : 'a';
  h = h % 12; if(h === 0) h = 12;
  const mStr = m < 10 ? '0' + m : '' + m;
  return `${h}:${mStr}${suffix}`;
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}) + " · " +
         d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
}

// Departure date/time through arrival time, e.g. "Thu, Aug 27 · 3:40 PM → 6:41 PM"
// (shows the arrival date too if the flight lands on a different calendar day)
function fmtDateRange(depIso, arrIso){
  const dep = new Date(depIso), arr = new Date(arrIso);
  const depStr = fmtDate(depIso);
  const arrTimeStr = arr.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  if(dep.toDateString() === arr.toDateString()){
    return `${depStr} → ${arrTimeStr}`;
  }
  const arrDateStr = arr.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  return `${depStr} → ${arrDateStr} · ${arrTimeStr}`;
}

// Departure→arrival line that shows a struck-through original time plus the new time
// when a flight's scheduled departure has shifted (e.g. a delay), e.g.:
// "Thu, Aug 27 · 3:40 PM → 4:15 PM · lands 6:41 PM"
function fmtDepartureLine(flight){
  const origIso = flight.originalDate || flight.date;
  const changed = Math.abs(new Date(flight.date) - new Date(origIso)) > 60000; // more than a minute = real change
  const dateLabel = new Date(origIso).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  const arrTimeStr = new Date(flight.arrival).toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});

  if(!changed){
    return fmtDateRange(flight.date, flight.arrival);
  }

  const origTimeStr = new Date(origIso).toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  const newTimeStr = new Date(flight.date).toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  return `${dateLabel} · <span class="strike">${origTimeStr}</span> <span class="new-time">${newTimeStr}</span> → ${arrTimeStr}`;
}

function cityLabel(a){ return a.state ? `${a.city}, ${a.state}` : a.city; }

// Returns the first non-null/undefined value among the arguments (old-Safari-safe stand-in
// for the `??` operator, which isn't supported before Safari 13.1 / iOS 13.4).
function firstDefined(){
  for(let i=0; i<arguments.length; i++){
    if(arguments[i] !== null && arguments[i] !== undefined) return arguments[i];
  }
  return undefined;
}

// ---- Geo helpers for in-flight stats (miles to go, nearest city + direction) ----
function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8; // Earth radius in miles
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function bearingDegrees(lat1, lon1, lat2, lon2){
  // Raw bearing in degrees from point 1 to point 2 (0-360), for numeric comparison against a
  // real aircraft heading — bearingCompass() below rounds this to one of 8 compass directions,
  // which isn't precise enough for that kind of check.
  const toRad = d => d * Math.PI / 180;
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function bearingCompass(lat1, lon1, lat2, lon2){
  // Compass direction from point 1 to point 2, e.g. "NW"
  const deg = bearingDegrees(lat1, lon1, lat2, lon2);
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

// Resolves the direction the plane icon should point: real ADS-B heading when available (it's
// stored as a formatted string like "199°" for display elsewhere, so it's parsed back to a
// number here), otherwise falling back to the bearing from the current position toward the
// destination — so the icon always at least points toward where the flight is actually headed,
// even without a live heading reading.
function planeHeadingDegrees(planeLat, planeLon, destLat, destLon, live){
  if(live && live.heading != null){
    const h = parseFloat(live.heading);
    if(!isNaN(h)) return h;
  }
  return bearingDegrees(planeLat, planeLon, destLat, destLon);
}

// ---- Weather (Open-Meteo — free, no API key needed) ----
// WMO weather codes -> icon + one-word description.
function wmoToWeather(code){
  if(code === 0) return { icon: '☀️', description: 'Clear' };
  if(code === 1 || code === 2) return { icon: '🌤️', description: 'Partly Cloudy' };
  if(code === 3) return { icon: '☁️', description: 'Cloudy' };
  if(code === 45 || code === 48) return { icon: '🌫️', description: 'Foggy' };
  if(code >= 51 && code <= 57) return { icon: '🌦️', description: 'Drizzle' };
  if(code >= 61 && code <= 67) return { icon: '🌧️', description: 'Rain' };
  if(code >= 71 && code <= 77) return { icon: '❄️', description: 'Snow' };
  if(code >= 80 && code <= 82) return { icon: '🌧️', description: 'Showers' };
  if(code === 85 || code === 86) return { icon: '❄️', description: 'Snow Showers' };
  if(code >= 95) return { icon: '⛈️', description: 'Storm' };
  return { icon: '🌡️', description: 'Mild' };
}

const weatherCache = {};
async function getWeather(airport){
  if(airport.lat == null) return null;
  const key = airport.lat + ',' + airport.lon;
  const cached = weatherCache[key];
  if(cached && (Date.now() - cached.time) < 15 * 60000) return cached.data;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${airport.lat}&longitude=${airport.lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const info = wmoToWeather(data.current.weather_code);
    const result = { temp, icon: info.icon, description: info.description };
    weatherCache[key] = { data: result, time: Date.now() };
    return result;
  }catch(e){
    return null;
  }
}

async function updateWeatherDisplay(from, to){
  const wxFromEl = document.getElementById('wxFrom');
  const wxToEl = document.getElementById('wxTo');
  if(wxFromEl){
    const w = await getWeather(from);
    if(w) wxFromEl.textContent = `${w.icon} ${w.temp}°F ${w.description}`;
  }
  if(wxToEl){
    const w = await getWeather(to);
    if(w) wxToEl.textContent = `${w.icon} ${w.temp}°F ${w.description}`;
  }
}

// Forecasted weather at a specific future time (for the flight-preview feature) — Open-Meteo's
// hourly forecast is reliable up to about 15 days out; beyond that this returns null and the UI
// shows "Forecast not available yet" rather than a stale or fabricated number.
async function getForecastWeather(airport, targetDate){
  if(airport.lat == null) return null;
  const daysOut = (targetDate - new Date()) / 86400000;
  if(daysOut < 0 || daysOut > 15) return null;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${airport.lat}&longitude=${airport.lon}&hourly=temperature_2m,weather_code&temperature_unit=fahrenheit&forecast_days=16&timezone=UTC`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const targetHour = new Date(targetDate);
    targetHour.setUTCMinutes(0,0,0);
    const targetIso = targetHour.toISOString().slice(0,13); // "YYYY-MM-DDTHH"
    const idx = data.hourly.time.findIndex(t => t.startsWith(targetIso));
    if(idx === -1) return null;
    const temp = Math.round(data.hourly.temperature_2m[idx]);
    const info = wmoToWeather(data.hourly.weather_code[idx]);
    return { temp, icon: info.icon, description: info.description };
  }catch(e){
    return null;
  }
}

function nearestCityTo(lat, lon){
  let best = null, bestDist = Infinity;
  for(const code in AIRPORTS){
    const a = AIRPORTS[code];
    if(a.lat == null) continue;
    const d = haversineMiles(lat, lon, a.lat, a.lon);
    if(d < bestDist){ bestDist = d; best = a; }
  }
  if(!best) return null;
  // direction from the city to the plane's current position
  const dir = bearingCompass(best.lat, best.lon, lat, lon);
  return { city: best, distance: Math.round(bestDist), direction: dir };
}

function flightTimeAndDistance(flight, from, to){
  let flightTime = '—';
  const dep = new Date(flight.date), arr = new Date(flight.arrival);
  const durMs = arr - dep;
  if(durMs > 0){
    const h = Math.floor(durMs / 3600000);
    const m = Math.floor((durMs % 3600000) / 60000);
    flightTime = (h > 0 ? `${h}h ` : '') + `${m}m`;
  }
  let distanceMi = '—';
  if(from.lat != null && to.lat != null){
    distanceMi = Math.round(haversineMiles(from.lat, from.lon, to.lat, to.lon)).toLocaleString();
  }
  return { flightTime, distanceMi };
}

let calendarViewDate = new Date(); // which month the calendar grid is currently showing

function renderCalendar(flights){
  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('calMonthLabel');
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  label.textContent = calendarViewDate.toLocaleDateString(undefined, {month:'long', year:'numeric'});

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  // Layover = time between one flight's arrival and the next flight's departure. Computed
  // across the FULL sorted schedule (not per-day) since connections often span midnight.
  // Capped at 36h so it only flags real layovers/overnights, not unrelated gaps between
  // separate trips days apart.
  const sortedAll = [...flights].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const layoverByFlight = {};
  for(let i = 1; i < sortedAll.length; i++){
    const prev = sortedAll[i-1], curr = sortedAll[i];
    const gapMs = new Date(curr.date) - new Date(prev.arrival);
    if(gapMs > 0 && gapMs < 36 * 3600000){
      layoverByFlight[prev.flightNo + '_' + prev.date] = gapMs;
    }
  }
  function fmtLayover(ms){
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    return (h > 0 ? `${h}h ` : '') + `${m}m`;
  }

  // Group flights by their departure day (local date) for quick lookup per calendar cell
  const flightsByDay = {};
  flights.forEach(f=>{
    const d = new Date(f.date);
    const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if(!flightsByDay[key]) flightsByDay[key] = [];
    flightsByDay[key].push(f);
  });

  let html = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
    html += `<div class="cal-weekday">${d}</div>`;
  });

  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  for(let i = 0; i < totalCells; i++){
    const dayNum = i - startOffset + 1;
    const cellDate = new Date(year, month, dayNum); // JS Date rolls negative/overflow days into adjacent months automatically
    const otherMonth = (dayNum < 1 || dayNum > daysInMonth);
    const key = cellDate.getFullYear() + '-' + cellDate.getMonth() + '-' + cellDate.getDate();
    const isToday = cellDate.toDateString() === today.toDateString();
    const dayFlights = (flightsByDay[key] || []).sort((a,b)=> new Date(a.date) - new Date(b.date));
    const chips = dayFlights.map(f => {
      const time = fmtCompactTime(f.date);
      const arrTime = fmtCompactTime(f.arrival);
      const layoverMs = layoverByFlight[f.flightNo + '_' + f.date];
      const layoverLine = layoverMs ? `<div class="cal-layover">${fmtLayover(layoverMs)} layover</div>` : '';
      const isPast = (new Date(f.arrival) <= today) || isMarkedLanded(f);
      const chipClass = (f.isCommuter ? 'cal-flight-chip commuter' : 'cal-flight-chip') + ' chip-clickable';
      const key = f.flightNo + '_' + f.date;
      return `<div class="${chipClass}" data-flight-key="${key}" data-is-past="${isPast}"><span class="chip-time">${time}–${arrTime}</span><span class="chip-route">${f.from}→${f.to}</span></div>${layoverLine}`;
    }).join('');

    html += `<div class="cal-day ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}">
      <div class="daynum">${cellDate.getDate()}</div>
      ${chips}
    </div>`;
  }
  grid.innerHTML = html;
}

// ---- Map rendering: real OpenStreetMap tiles when the Leaflet library loaded successfully
// (needs a live network connection — works once hosted, e.g. on Netlify), automatically
// falling back to a dependency-free SVG drawing if Leaflet couldn't load (e.g. sandboxed
// previews that block external resources). Either way something always renders.
function renderMap(containerId, from, to, planeFrac, planeLive, trail, isEstimate, useFullBounds){
  if(from.lat == null || to.lat == null){
    const el = document.getElementById(containerId); if(el) el.innerHTML = '';
    return;
  }
  if(typeof L !== 'undefined'){
    try{
      const map = L.map(containerId, { zoomControl:false, attributionControl:false, dragging:true, scrollWheelZoom:false });

      // While actively in flight (a real position is known), zoom tightly to just the current
      // position and the destination — the origin is already far behind and including it in the
      // view just wastes screen space on empty ocean/land the flight has long since passed. The
      // ground-preview map (no plane position at all) and the flight-replay view (useFullBounds)
      // still show the full origin-to-destination route instead, since that's the whole point of
      // those views — a preview of the planned trip, or a look back at the entire journey.
      let lat, lon;
      if(planeFrac != null){
        if(planeLive){ lat = planeLive.lat; lon = planeLive.lon; }
        else { lat = from.lat + (to.lat-from.lat)*planeFrac; lon = from.lon + (to.lon-from.lon)*planeFrac; }
      }
      if(planeFrac != null && !useFullBounds){
        map.fitBounds(L.latLngBounds([lat, lon], [to.lat, to.lon]), { padding:[50,50] });
      } else {
        map.fitBounds(L.latLngBounds([from.lat, from.lon],[to.lat, to.lon]), { padding:[40,40] });
      }

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { subdomains:'abc', maxZoom:19 }).addTo(map);
      addRadarLayer(map);
      L.circleMarker([from.lat, from.lon], { radius:6, color:'#3AAFA9', fillColor:'#3AAFA9', fillOpacity:1 }).addTo(map);
      L.circleMarker([to.lat, to.lon], { radius:6, color:'#F5A623', fillColor:'#F5A623', fillOpacity:1 }).addTo(map);
      L.polyline([[from.lat,from.lon],[to.lat,to.lon]], { color:'#EDEAE0', weight:2, dashArray:'2 8', opacity:.6 }).addTo(map);
      // Actual breadcrumb trail of real observed positions — a solid line, distinct from the
      // dashed straight-line route above, showing where the flight has genuinely been so far.
      if(trail && trail.length > 1){
        L.polyline(trail.map(p => [p.lat, p.lon]), { color:'#3AAFA9', weight:3, opacity:.85 }).addTo(map);
      }
      if(planeFrac != null){
        // The ✈️ emoji renders facing roughly NE (~45°) by default across most platforms, so that
        // offset is subtracted to align the rotation with the actual compass heading.
        const heading = planeHeadingDegrees(lat, lon, to.lat, to.lon, planeLive);
        const rotation = heading - 45;
        // Estimated positions get a visually distinct marker — dimmer, with a dashed ring —
        // so it's never mistaken for a real confirmed position at a glance.
        const iconHtml = isEstimate
          ? `<div style="position:relative;width:32px;height:32px;">
               <div style="position:absolute;inset:0;border:2px dashed rgba(245,166,35,.75);border-radius:50%;"></div>
               <div class="plane-icon" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.55;transform:rotate(${rotation}deg);">✈️</div>
             </div>`
          : `<div class="plane-icon" style="transform:rotate(${rotation}deg);">✈️</div>`;
        const iconSize = isEstimate ? [32,32] : [24,24];
        const iconAnchor = isEstimate ? [16,16] : [12,12];
        const planeIcon = L.divIcon({ className:'', html: iconHtml, iconSize, iconAnchor });
        L.marker([lat, lon], { icon: planeIcon }).addTo(map);
      }
      return;
    }catch(e){ /* fall through to offline drawing below */ }
  }
  drawRoute(containerId, from, to, planeFrac, planeLive, trail, isEstimate, useFullBounds);
}

// Live precipitation radar overlay — Iowa Environmental Mesonet (Iowa State University), a free
// public NEXRAD mosaic service using the standard green/yellow/orange/red reflectivity scale.
// No key needed, and it's a stable tile URL (their server always serves the latest mosaic under
// this path), so unlike some radar APIs there's no separate timestamp lookup required first.
function addRadarLayer(map){
  L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png', {
    opacity: 0.6, zIndex: 5, attribution: 'NEXRAD &copy; IEM',
  }).addTo(map);
}

// ---- Self-contained fallback route drawing (no map tiles, no external libraries) ----
// Used automatically when Leaflet/OSM tiles aren't reachable (e.g. sandboxed local previews).
function drawRoute(containerId, from, to, planeFrac, planeLive, trail, isEstimate, useFullBounds){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(from.lat == null || to.lat == null){ el.innerHTML = ''; return; }

  // Determine the plane's position first — needed for the viewport bounds below as well as the
  // icon itself, so it's computed once up front rather than duplicated later.
  let planeLat, planeLon;
  if(planeFrac != null){
    if(planeLive){ planeLat = planeLive.lat; planeLon = planeLive.lon; }
    else { planeLat = from.lat + (to.lat-from.lat)*planeFrac; planeLon = from.lon + (to.lon-from.lon)*planeFrac; }
  }

  const W = 600, H = containerId === 'previewMapContainer' ? 220 : 280, PAD = 50;
  // While actively in flight, bound the viewport to just current position + destination — same
  // as the Leaflet map — rather than the full origin-to-destination span (which, for a long
  // route, forces a much wider zoom-out than needed for what's actually left to fly). The
  // ground-preview map and the flight-replay view (useFullBounds) always show the full route.
  const boundsFrom = (planeFrac != null && !useFullBounds) ? { lat: planeLat, lon: planeLon } : from;
  const minLat = Math.min(boundsFrom.lat, to.lat), maxLat = Math.max(boundsFrom.lat, to.lat);
  const minLon = Math.min(boundsFrom.lon, to.lon), maxLon = Math.max(boundsFrom.lon, to.lon);
  const latSpan = Math.max(maxLat - minLat, 4);
  const lonSpan = Math.max(maxLon - minLon, 4);

  function project(lat, lon){
    const x = PAD + ((lon - minLon) / lonSpan) * (W - 2*PAD);
    const y = PAD + (1 - (lat - minLat) / latSpan) * (H - 2*PAD);
    return [x, y];
  }

  const [x1,y1] = project(from.lat, from.lon);
  const [x2,y2] = project(to.lat, to.lon);

  let planeDot = '';
  if(planeFrac != null){
    const [px, py] = project(planeLat, planeLon);
    // Same rotation approach as the Leaflet map: real heading when available, otherwise bearing
    // toward the destination — offset by 45° to match the ✈️ emoji's default facing direction.
    const heading = planeHeadingDegrees(planeLat, planeLon, to.lat, to.lon, planeLive);
    const rotation = heading - 45;
    // Estimated positions get a dashed ring behind them and reduced opacity, matching the
    // Leaflet map's treatment — never mistaken for a real confirmed position at a glance.
    const ring = isEstimate ? `<circle cx="${px}" cy="${py}" r="14" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="3 3" opacity=".75"/>` : '';
    const opacity = isEstimate ? '.55' : '1';
    planeDot = `${ring}<text x="${px}" y="${py+7}" font-size="22" text-anchor="middle" opacity="${opacity}" transform="rotate(${rotation} ${px} ${py})">✈️</text>`;
  }

  // Actual breadcrumb trail, same as the Leaflet map — a solid line through real observed
  // positions, distinct from the dashed straight-line route.
  let trailLine = '';
  if(trail && trail.length > 1){
    const points = trail.map(p => project(p.lat, p.lon).join(',')).join(' ');
    trailLine = `<polyline points="${points}" fill="none" stroke="#3AAFA9" stroke-width="3" opacity=".85"/>`;
  }

  el.innerHTML = `
    <svg class="fallback-route-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid-${containerId}" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="${W}" height="${H}" fill="url(#grid-${containerId})"/>
      <text x="8" y="16" font-size="9" fill="rgba(255,255,255,.35)" font-family="monospace">offline map (fallback)</text>
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#EDEAE0" stroke-width="2" stroke-dasharray="2 8" opacity=".6"/>
      ${trailLine}
      <circle cx="${x1}" cy="${y1}" r="6" fill="#3AAFA9"/>
      <circle cx="${x2}" cy="${y2}" r="6" fill="#F5A623"/>
      ${planeDot}
    </svg>`;
}

function renderGroundBoard(nextFlight, recentlyLanded, lastCompletedFlight){
  const eyebrow = document.getElementById('boardEyebrow');
  const badgeSlot = document.getElementById('boardBadge');
  eyebrow.classList.remove('flying');
  nextFlightGlobal = nextFlight || null;

  // "Landed at (City) X min ago" banner — shown for up to 45 minutes after arrival, but hidden
  // early if the next flight is already within 30 minutes of its own departure (at that point
  // the countdown/next-up info below takes priority instead).
  let landedLine = '';
  if(recentlyLanded){
    const minsAgo = Math.round((Date.now() - new Date(recentlyLanded.arrival).getTime()) / 60000);
    const nextDepMinsAway = nextFlight ? (new Date(nextFlight.date) - Date.now()) / 60000 : Infinity;
    if(minsAgo >= 0 && minsAgo <= 45 && nextDepMinsAway > 30){
      const landedCity = cityLabel(airportInfo(recentlyLanded.to));
      landedLine = `<div class="landed-banner">Landed at ${landedCity} ${minsAgo} min${minsAgo === 1 ? '' : 's'} ago</div>`;
    }
  }

  if(!nextFlight){
    eyebrow.textContent = 'Home';
    eyebrow.classList.add('ground');
    eyebrow.classList.remove('commuter');
    badgeSlot.innerHTML = '';
    document.getElementById('boardBody').innerHTML = `${landedLine}<div class="ground-msg">Not currently flying. <b>No trips scheduled.</b></div>`;
    return;
  }

  // "Commuting" as the header is only accurate when the commute is actually imminent — showing
  // it a day or more ahead of an upcoming commuter flight is misleading, since nothing commuting-
  // related is happening yet. Falls back to the normal Home/Layover logic outside that window.
  const HOME_AIRPORTS = ['FLL', 'DJT', 'MIA'];
  const hoursUntilNext = (new Date(nextFlight.date) - new Date()) / 3600000;
  const commuteImminent = nextFlight.isCommuter && hoursUntilNext <= 12;

  if(commuteImminent){
    eyebrow.textContent = 'Commuting';
    eyebrow.classList.add('ground', 'commuter');
  } else {
    // If the last completed flight was a personal commuter flight landing at one of the known
    // home-area airports, that's genuinely "arrived home" — not a work-trip layover — so it's
    // called out directly rather than showing "Layover in West Palm Beach" etc.
    const arrivedHome = lastCompletedFlight
      && lastCompletedFlight.isCommuter
      && HOME_AIRPORTS.includes(lastCompletedFlight.to);

    if(arrivedHome){
      eyebrow.textContent = 'Home';
      eyebrow.classList.add('ground');
      eyebrow.classList.remove('commuter');
    } else {
      // Current location is wherever the last flight actually landed — not necessarily the same
      // as the next flight's departure city, if there's a gap before it (e.g. a return commuter
      // leg hasn't been booked yet). Only falls back to the next flight's departure if there's
      // no flight history at all yet to go on.
      const currentAirportCode = lastCompletedFlight ? lastCompletedFlight.to : nextFlight.from;
      const currentCity = cityLabel(airportInfo(currentAirportCode));
      eyebrow.textContent = `Layover in ${currentCity}`;
      eyebrow.classList.add('ground');
      eyebrow.classList.remove('commuter');
    }
  }

  const body = document.getElementById('boardBody');
  const from = airportInfo(nextFlight.from), to = airportInfo(nextFlight.to);
  badgeSlot.innerHTML = flightBadge(nextFlight);
  const { flightTime, distanceMi } = flightTimeAndDistance(nextFlight, from, to);

  // Commuter flights show as "Commuting flight" here rather than literal airport codes — the
  // route itself isn't the interesting part of a personal commute the way it is for a work trip.
  const nextUpText = nextFlight.isCommuter
    ? `Commuting flight · ${cityLabel(from)} → ${cityLabel(to)}`
    : `${cityLabel(from)} → ${cityLabel(to)}`;

  body.innerHTML = `
    ${landedLine}
    <div class="ground-msg">Not currently flying</div>
    <div class="next-up">Next up: <b>${nextUpText}</b></div>
    <div class="next-up-date">${fmtDepartureLine(nextFlight)}</div>
    <div class="route-line" style="margin-top:16px;">
      <div class="airport">${nextFlight.from}<span class="city">${cityLabel(from)}</span><span class="weather" id="wxFrom">…</span></div>
      <div class="mid-column"><div class="countdown countdown-inline" id="countdown">—</div></div>
      <div class="airport end">${nextFlight.to}<span class="city">${cityLabel(to)}</span><span class="weather" id="wxTo">…</span></div>
    </div>
    <div id="previewMapContainer"></div>
    <div class="stat-row">
      <div class="stat"><div class="v">${flightTime}</div><div class="l">Flight Time</div></div>
      <div class="stat"><div class="v">${distanceMi}</div><div class="l">Miles</div></div>
    </div>`;
  updateCountdown();
  updateWeatherDisplay(from, to);
  renderMap('previewMapContainer', from, to, null, null);
}

function updateCountdown(){
  const el = document.getElementById('countdown');
  if(!el || !nextFlightGlobal) return;
  const currentDep = new Date(nextFlightGlobal.date);
  const diff = currentDep - new Date();

  if(diff > 0){
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const parts = [];
    if(d) parts.push(`${d}d`);
    if(d || h) parts.push(`${h}h`);
    parts.push(`${m}m`);
    el.textContent = parts.join(' ') + ' until takeoff';
    el.classList.remove('delayed');
    return;
  }

  // Past the latest known departure estimate — run the elapsed timer off the ORIGINAL
  // scheduled time so it reflects total delay, not just time since the last update.
  const origDep = new Date(nextFlightGlobal.originalDate || nextFlightGlobal.date);
  const elapsedMs = new Date() - origDep;
  const elapsedMin = Math.floor(elapsedMs / 60000);
  if(elapsedMin < 5){
    el.textContent = 'Departing soon';
  } else {
    const h = Math.floor(elapsedMs / 3600000);
    const m = Math.floor((elapsedMs % 3600000) / 60000);
    const parts = [];
    if(h) parts.push(`${h}h`);
    parts.push(`${m}m`);
    el.textContent = 'Delayed ' + parts.join(' ');
  }
  el.classList.add('delayed');
}

// Tracks real observed positions for the flight currently being displayed, so the map can draw
// an actual breadcrumb trail from takeoff to now — not just the straight dashed line to the
// destination. Only real live positions are recorded (not the estimated fallback, which is
// always exactly on that straight line anyway and would add nothing). Stored centrally on the
// same Apps Script backend everything else syncs from: when a different flight starts being
// tracked, the trail-so-far (possibly recorded by another device, e.g. the kiosk) is pulled down
// first, then each new point is pushed back up as it's observed — so opening the page mid-flight
// on a different device shows the real trail from takeoff, not just from that moment on.
let breadcrumbTrail = [];
let breadcrumbFlightKey = null;

async function fetchServerTrail(key){
  try{
    const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
    const url = `${CALENDAR_FEED_URL}${sep}getTrail=1&flightKey=${encodeURIComponent(key)}&cb=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    return Array.isArray(data.trail) ? data.trail : [];
  }catch(e){
    return [];
  }
}

function recordServerPosition(key, lat, lon){
  const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
  const url = `${CALENDAR_FEED_URL}${sep}recordPosition=1&flightKey=${encodeURIComponent(key)}&lat=${lat}&lon=${lon}&cb=${Date.now()}`;
  fetch(url, { cache: 'no-store' }).catch(() => {}); // fire-and-forget — doesn't block rendering
}

async function recordBreadcrumb(flight, live){
  if(!live || live.lat == null) return;
  const key = flight.flightNo + '_' + flight.date;
  if(key !== breadcrumbFlightKey){
    breadcrumbFlightKey = key;
    breadcrumbTrail = await fetchServerTrail(key); // pick up any trail-so-far from another device
  }
  const last = breadcrumbTrail[breadcrumbTrail.length - 1];
  // Skip near-duplicate points (e.g. two polls in a row with almost no movement) to keep the
  // trail meaningful rather than cluttered.
  if(!last || haversineMiles(last.lat, last.lon, live.lat, live.lon) > 0.5){
    breadcrumbTrail.push({ lat: live.lat, lon: live.lon, t: Date.now() });
    recordServerPosition(key, live.lat, live.lon);
  }
}

// Fetches the airline's own updated arrival estimate (AeroDataBox's revised time — the same
// real data Google Flights surfaces) for whichever flight is currently being tracked. Throttled
// to once per 10 minutes per flight (matching the backend's own cache window), since this is a
// real API call and there's no reason to repeat it every 30-second refresh cycle.
let revisedArrivalCache = {};
async function getRevisedArrival(flight){
  const key = flight.flightNo + '_' + flight.date;
  const cached = revisedArrivalCache[key];
  if(cached && Date.now() - cached.fetchedAt < 10 * 60000) return cached.value;

  try{
    const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
    const url = `${CALENDAR_FEED_URL}${sep}revisedArrival=1&flightNo=${encodeURIComponent(flight.flightNo)}&date=${encodeURIComponent(flight.date)}&cb=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    const value = (data.found && data.revisedArrivalUtc) ? new Date(data.revisedArrivalUtc) : null;
    revisedArrivalCache[key] = { value, fetchedAt: Date.now() };
    return value;
  }catch(e){
    revisedArrivalCache[key] = { value: null, fetchedAt: Date.now() };
    return null;
  }
}

async function renderFlyingBoard(flight, live){
  const eyebrow = document.getElementById('boardEyebrow');
  eyebrow.classList.remove('ground');
  eyebrow.classList.add('flying');
  if(flight.isCommuter){
    eyebrow.textContent = 'Commuting — In the Air';
    eyebrow.classList.add('commuter');
  } else {
    eyebrow.textContent = 'In the air right now';
    eyebrow.classList.remove('commuter');
  }
  const body = document.getElementById('boardBody');
  const from = airportInfo(flight.from), to = airportInfo(flight.to);

  // Prefer a real, live-confirmed position. When no live signal is available (ground-based ADS-B
  // has real coverage gaps over sparsely-populated areas), fall back to a schedule-based estimate
  // so the board always shows something rather than going blank — capped short of the destination
  // so it never falsely claims "arrived" if a delay has pushed the real landing later than the
  // calendar's current estimate.
  const hasLive = !!(live && live.lat != null && live.lon != null);
  let planeLat, planeLon, isEstimate = false;
  if(hasLive){
    planeLat = live.lat; planeLon = live.lon;
  } else {
    const trailKey = flight.flightNo + '_' + flight.date;
    const arr = new Date(flight.arrival);
    if(trailKey === breadcrumbFlightKey && breadcrumbTrail.length > 0){
      // Hybrid estimate: anchor on the last confirmed real position, then nudge it toward the
      // destination in proportion to how much of the REMAINING scheduled time has passed since
      // that position was recorded — not the plane's total scheduled journey from origin. Right
      // after a signal drop this stays very close to the last real spot (avoiding the old wild
      // jump during a ground delay or right after takeoff), while still creeping realistically
      // toward the destination if the gap genuinely runs long, rather than staying frozen forever.
      const last = breadcrumbTrail[breadcrumbTrail.length - 1];
      const lastTime = last.t ? new Date(last.t) : new Date(flight.date);
      const remainingAtLastKnown = arr - lastTime;
      const elapsedSinceLastKnown = new Date() - lastTime;
      const frac = remainingAtLastKnown > 0
        ? Math.min(0.97, Math.max(0, elapsedSinceLastKnown / remainingAtLastKnown))
        : 0;
      planeLat = last.lat + (to.lat - last.lat) * frac;
      planeLon = last.lon + (to.lon - last.lon) * frac;
    } else {
      // No real position recorded yet for this flight at all (e.g. right at the very start,
      // before the first live signal has come in) — schedule-based is the only thing to go on.
      const dep = new Date(flight.date);
      const totalMs = arr - dep;
      const fracRaw = totalMs > 0 ? (new Date() - dep) / totalMs : 0.5;
      const frac = Math.min(0.97, Math.max(0, fracRaw));
      planeLat = from.lat + (to.lat - from.lat) * frac;
      planeLon = from.lon + (to.lon - from.lon) * frac;
    }
    isEstimate = true;
  }
  // Whichever position was just computed (live or estimated) is exactly what gets drawn on the
  // map — using the same value for both the text stats and the map icon guarantees they can
  // never disagree with each other.
  const mapPlanePosition = { lat: planeLat, lon: planeLon };

  let timeToLand = '—';
  const msLeft = new Date(flight.arrival) - new Date();
  if(msLeft > 5 * 60000){
    const h = Math.floor(msLeft / 3600000);
    const m = Math.floor((msLeft % 3600000) / 60000);
    timeToLand = (h > 0 ? `${h}h ` : '') + `${m}m`;
  } else if(msLeft > 0 || hasLive){
    timeToLand = 'Landing soon';
  } else {
    // Past the scheduled arrival with no live confirmation — be honest that this is stale
    // rather than falsely asserting the flight has landed or is exactly on schedule.
    timeToLand = 'Overdue';
  }

  let milesToGo = '—';
  if(to.lat != null && planeLat != null){
    milesToGo = Math.round(haversineMiles(planeLat, planeLon, to.lat, to.lon)).toLocaleString();
  }

  // Arrival time display, matching the same "strike through scheduled, show updated" pattern
  // used elsewhere in this app for delayed departures. Priority for the updated time:
  //   1. The airline's own updated ETA (AeroDataBox's revised time) — the same real, official
  //      figure a Google search would show, reflecting actual ATC/gate/routing delays.
  //   2. Our own live-speed-based estimate — real remaining distance ÷ current groundspeed,
  //      used only if the airline hasn't published a revised time for some reason.
  // The scheduled time is only struck through if the updated time actually differs meaningfully
  // (3+ minutes) — otherwise "on time" would just be noise, not useful correction.
  const scheduledTimeStr = new Date(flight.arrival).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  let updatedArrival = null, updatedArrivalSource = null;
  const revisedArrival = hasLive ? await getRevisedArrival(flight) : null;
  if(revisedArrival){
    updatedArrival = revisedArrival; updatedArrivalSource = 'updated';
  } else if(hasLive && live.speed && to.lat != null){
    const remainingMiles = haversineMiles(planeLat, planeLon, to.lat, to.lon);
    const speedMph = live.speed * 1.15078; // knots to mph
    if(speedMph > 20){ // sanity floor — avoids a wild ETA from a near-zero groundspeed reading
      const hoursRemaining = remainingMiles / speedMph;
      updatedArrival = new Date(Date.now() + hoursRemaining * 3600000);
      updatedArrivalSource = 'live est.';
    }
  }

  let arrivingLabel;
  if(updatedArrival && Math.abs(updatedArrival - new Date(flight.arrival)) / 60000 >= 3){
    const updatedTimeStr = updatedArrival.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    arrivingLabel = `Arriving <span class="strike">${scheduledTimeStr}</span> <b style="color:var(--teal);">${updatedTimeStr}</b> <span style="font-size:10px;color:var(--dim);">(${updatedArrivalSource})</span>`;
  } else {
    arrivingLabel = `Arriving ${scheduledTimeStr}`;
  }

  // nearest city + direction, e.g. "143 mi NW of Chicago, IL" — labeled clearly when estimated
  let locationLine = '';
  if(planeLat != null){
    const nearest = nearestCityTo(planeLat, planeLon);
    if(nearest && nearest.distance > 0){
      const prefix = isEstimate ? '📍 (estimated) ' : '📍 ';
      locationLine = `<div class="location-line">${prefix}${nearest.distance} mi ${nearest.direction} of ${cityLabel(nearest.city)}</div>`;
    }
  }
  // Temporary diagnostic — shows exactly why live tracking wasn't used, so we can tell a real
  // coverage gap apart from a genuine bug (e.g. a CORS block or repeated errors).
  const debugLine = (isEstimate && lastAdsbDebug.length)
    ? `<div class="location-line" style="opacity:.6;font-size:11px;">🛰 ${lastAdsbDebug.join(' | ')}</div>`
    : '';

  // Real-distance flight progress bar, with the "time until landing" countdown stacked directly
  // above it — both now live in the middle column between the two airport codes, freeing up the
  // full-width row this used to occupy so the map below can be made taller instead.
  let progressBar = '';
  if(planeLat != null && from.lat != null && to.lat != null){
    const totalDist = haversineMiles(from.lat, from.lon, to.lat, to.lon);
    const traveled = haversineMiles(from.lat, from.lon, planeLat, planeLon);
    const pct = totalDist > 0 ? Math.min(100, Math.max(0, (traveled / totalDist) * 100)) : 0;
    progressBar = `
      <div class="mid-column">
        <div class="time-to-land-inline">${timeToLand} <span class="l">until landing</span></div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;"></div>
          <div class="progress-plane" style="left:${pct}%;">✈️</div>
        </div>
      </div>`;
  }

  document.getElementById('boardBadge').innerHTML = flightBadge(flight, live && live.aircraftType);
  const estimateBanner = isEstimate
    ? `<div class="estimate-warning">⚠ ESTIMATED POSITION — live signal not currently available</div>`
    : '';
  body.innerHTML = `
    ${estimateBanner}
    <div class="route-line">
      <div class="airport">${flight.from}<span class="city">${cityLabel(from)}</span><span class="weather" id="wxFrom">…</span><span class="tag">Departed ${new Date(flight.date).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</span></div>
      ${progressBar}
      <div class="airport end">${flight.to}<span class="city">${cityLabel(to)}</span><span class="weather" id="wxTo">…</span><span class="tag">${arrivingLabel}</span></div>
    </div>
    ${locationLine}
    ${debugLine}
    <div id="mapContainer"></div>
    <div class="stat-row">
      <div class="stat"><div class="v">${firstDefined(live && live.aircraftType, flight.aircraft, '—')}</div><div class="l">Aircraft</div></div>
      <div class="stat"><div class="v">${firstDefined(live && live.altitude, '—')}</div><div class="l">Altitude (ft)</div></div>
      <div class="stat"><div class="v">${firstDefined(live && live.speed, '—')}</div><div class="l">Speed (kt)</div></div>
      <div class="stat"><div class="v">${firstDefined(live && live.heading, '—')}</div><div class="l">Heading</div></div>
      <div class="stat"><div class="v">${milesToGo}</div><div class="l">Miles to Go</div></div>
    </div>`;

  // Map always shows a plane icon at exactly the same position used for the stats above.
  if(hasLive) await recordBreadcrumb(flight, live);
  renderMap('mapContainer', from, to, 1, mapPlanePosition, breadcrumbTrail, isEstimate);
  updateWeatherDisplay(from, to);
}

// Diagnostic record of the most recent lookup attempt — shown on the flying board so a real
// failure reason is visible instead of guessed.
let lastAdsbDebug = [];

async function tryLiveLookup(callsign){
  lastAdsbDebug = [];
  // Routed through our own Apps Script backend (fetchLivePosition in calendar-sync.gs) instead
  // of calling adsb.one/adsb.lol directly from the browser — those services appear to block
  // direct cross-origin browser requests (CORS), which was silently failing every lookup.
  // A server-side call from Apps Script isn't subject to that restriction.
  if(!CALENDAR_FEED_URL || CALENDAR_FEED_URL.startsWith("PASTE_")){
    lastAdsbDebug.push('live proxy: CALENDAR_FEED_URL not configured');
    return null;
  }
  try{
    const sep = CALENDAR_FEED_URL.includes('?') ? '&' : '?';
    const url = `${CALENDAR_FEED_URL}${sep}live=${encodeURIComponent(callsign)}&cb=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok){
      lastAdsbDebug.push(`live proxy: HTTP ${res.status}`);
      return null;
    }
    const data = await res.json();
    if(!data.found){
      lastAdsbDebug.push(`live proxy: no aircraft found for "${callsign}"`);
      return null;
    }
    lastAdsbDebug.push(`live proxy: OK (lat=${data.lat}, lon=${data.lon})`);
    const result = {
      icao24: data.icao24,
      lat: data.lat,
      lon: data.lon,
      altitude: data.altitude,
      speed: data.speed,
      heading: data.heading != null ? data.heading + '°' : null,
      onGround: data.onGround,
    };
    result.aircraftType = await lookupAircraftType(result.icao24);
    return result;
  }catch(e){
    lastAdsbDebug.push(`live proxy: fetch failed (${e.message})`);
    return null;
  }
}

async function lookupAircraftType(icao24){
  // hexdb.io — free, keyless aircraft registry lookup by ICAO24/Mode-S hex.
  if(!icao24) return null;
  try{
    const res = await fetch(`https://hexdb.io/api/v1/aircraft/${icao24}`);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data || data.status === '404' || !data.Manufacturer) return null;
    return `${data.Manufacturer} ${data.ICAOTypeCode || data.Type || ''}`.trim();
  }catch(e){
    return null;
  }
}

// Once we've directly observed a specific flight land — either the "on ground" flag, or the
// aircraft getting genuinely close to its destination at low altitude — that instance is marked
// landed permanently (keyed by flight number + scheduled departure, so it's specific to this one
// flight, not just the callsign). This means a later reuse of the same callsign for a different,
// unrelated leg (common on short multi-leg rotations) can never be mistaken for this flight still
// being airborne, no matter how much later it reappears — a real fix, not just a time guess.
function landedFlightKey(flight){ return flight.flightNo + '_' + flight.date; }
function isMarkedLanded(flight){
  try{
    const keys = JSON.parse(localStorage.getItem('landedFlightKeys') || '[]');
    return keys.includes(landedFlightKey(flight));
  }catch(e){ return false; }
}
function markLanded(flight){
  try{
    const keys = JSON.parse(localStorage.getItem('landedFlightKeys') || '[]');
    const key = landedFlightKey(flight);
    if(!keys.includes(key)){
      keys.push(key);
      // Light cleanup: keep at most the most recent 100 entries so this never grows unbounded.
      const trimmed = keys.slice(-100);
      localStorage.setItem('landedFlightKeys', JSON.stringify(trimmed));
    }
  }catch(e){ /* storage unavailable — landing just won't be remembered across reloads */ }
}

async function refresh(){
  const now = new Date();
  const clockEl = document.getElementById('clock');
  if(clockEl) clockEl.textContent = now.toLocaleTimeString();

  const upcoming = MY_FLIGHTS.filter(f => new Date(f.date) > now)
                             .sort((a,b)=> new Date(a.date)-new Date(b.date));

  // Most recently concluded flight (by scheduled arrival) — used for the brief "Landed at
  // (City) X min ago" banner on the ground board. Bounded to the last few hours so a much older
  // flight never resurfaces as "recently landed" after a long gap with nothing scheduled.
  const recentlyLanded = MY_FLIGHTS
    .filter(f => new Date(f.arrival) <= now && now - new Date(f.arrival) <= 3 * 3600000)
    .sort((a,b) => new Date(b.arrival) - new Date(a.arrival))[0] || null;

  // The single most recent completed flight, with NO time bound — used to determine actual
  // current location (wherever the last flight actually landed), regardless of how long ago
  // that was. This matters whenever there's a multi-day gap before the next scheduled flight
  // (e.g. a commuter return leg hasn't been booked yet) — the next flight's departure city is
  // not necessarily where you actually are right now, but your last landing spot always is.
  const lastCompletedFlight = MY_FLIGHTS
    .filter(f => new Date(f.arrival) <= now)
    .sort((a,b) => new Date(b.arrival) - new Date(a.arrival))[0] || null;

  // Primary candidate: within the normal scheduled window, with a modest post-arrival grace
  // period for ordinary taxi-in/deplaning delay (not a multi-hour buffer — see below for that).
  const scheduleCandidate = MY_FLIGHTS.find(f=>{
    const dep = new Date(f.date), arr = new Date(f.arrival);
    return now >= new Date(dep.getTime() - 20*60000) && now <= new Date(arr.getTime() + 45*60000);
  });

  // Secondary candidate: already past that window, but only worth checking live tracking for —
  // if it's genuinely still airborne (a real delay beyond the schedule's current estimate),
  // live confirmation will show that and we keep displaying it. If not, we don't linger on it.
  // The confirmed-landed check above is the real safeguard against callsign reuse; this time
  // bound is just a secondary fallback in case we never got a live signal close enough to
  // directly confirm landing (e.g. ADS-B coverage dropped out before final approach).
  const lateCandidate = !scheduleCandidate ? MY_FLIGHTS
    .filter(f => new Date(f.arrival).getTime() + 45*60000 < now)
    .filter(f => now - new Date(f.arrival) <= 4 * 3600000)
    .sort((a,b) => new Date(b.date) - new Date(a.date))[0] : null;

  const candidate = scheduleCandidate || lateCandidate;

  if(candidate){
    const alreadyLocked = isMarkedLanded(candidate);
    const live = await tryLiveLookup(candidate.callsign);
    const hasLiveSignal = !!(live && live.lat != null);
    const confirmedOnGround = !!(live && live.onGround);

    // Heading plausibility check — only applied once a flight is past its normal scheduled
    // window (a flight still within its expected window can legitimately be flying an indirect
    // routing, so this is deliberately not checked there). If the aircraft's actual heading is
    // nowhere close to the bearing toward its destination, this is very unlikely to genuinely be
    // this flight inbound to that airport — most likely a same-day reused callsign for a
    // different, unrelated leg (e.g. heading back the opposite direction).
    let headingPlausible = true;
    if(!scheduleCandidate && hasLiveSignal && live.heading != null && !confirmedOnGround){
      const destInfo = airportInfo(candidate.to);
      if(destInfo){
        const bearingToDest = bearingDegrees(live.lat, live.lon, destInfo.lat, destInfo.lon);
        const actualHeading = parseFloat(live.heading); // live.heading is a formatted string like "199°"
        let diff = Math.abs(actualHeading - bearingToDest);
        if(diff > 180) diff = 360 - diff;
        if(diff > 90) headingPlausible = false;
      }
    }
    const validSignal = hasLiveSignal && headingPlausible;

    // Proximity check: close to the destination at low altitude means landing is genuinely
    // imminent. This locks the flight number now (protecting against a same-day reused callsign
    // for a later, unrelated leg being mistaken for this one) — but doesn't switch the display to
    // "landed" by itself. It keeps showing real flight progress (naturally reading as "Landing
    // soon" once close enough) until we either lose the signal or get a genuine on-ground
    // confirmation, whichever comes first.
    let nearDestination = false;
    if(hasLiveSignal && !confirmedOnGround){
      const destInfo = airportInfo(candidate.to);
      if(destInfo){
        const distMi = haversineMiles(live.lat, live.lon, destInfo.lat, destInfo.lon);
        if(distMi <= 15 && (live.altitude == null || live.altitude <= 3000)) nearDestination = true;
      }
    }
    if(nearDestination && !alreadyLocked) markLanded(candidate);
    const locked = alreadyLocked || nearDestination;

    if(locked && (!validSignal || confirmedOnGround)){
      // Either there's no valid signal for this flight anymore (gone, or clearly a different
      // leg by heading) or the feed directly confirms it's on the ground — genuinely done flying.
      renderGroundBoard(upcoming[0], recentlyLanded, lastCompletedFlight);
    } else if(scheduleCandidate || validSignal){
      // Still getting a real, plausible signal (or within the normal scheduled window) — keep
      // showing it as actually in progress, even if already locked as landing-imminent.
      await renderFlyingBoard(candidate, live);
    } else {
      // No valid live signal at all and past the scheduled window — nothing left to show for it.
      renderGroundBoard(upcoming[0], recentlyLanded, lastCompletedFlight);
    }
  } else {
    renderGroundBoard(upcoming[0], recentlyLanded, lastCompletedFlight);
  }
  renderCalendar(MY_FLIGHTS);
}
